<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Registration Form</title>
  </head>
  <body>
    <form action="#" class="student-registration-form">
      <fieldset>
        <legend><b>Student Registration</b></legend>
        <label for="full-name"><b>Full Name:</b></label>
        <input
          type="text"
          name="full-name"
          id="full-name"
          placeholder="Enter your full name"
          required
        />
        <br /><br />
        <label for="email"><b>Email:</b></label>
        <input
          type="email"
          name="email"
          id="email"
          placeholder="Enter your email"
          required
        />
        <br /><br />
        <label for="tel"><b>Phone:</b></label>
        <input type="tel" name="tel" id="tel" placeholder="Enter your phone" />
        <br /><br />
        <label for="date-of-birth"><b>Date of Birth:</b></label>
        <input type="date" name="date-of-birth" id="date-of-birth" />
        <br /><br />
        <fieldset>
          <legend><b>Gender:</b></legend>
          <input type="radio" name="gender" id="male" value="Male" />
          <label for="male"><b>Male</b></label>
          <input type="radio" name="gender" id="female" value="Female" />
          <label for="female"><b>Female</b></label>
          <input type="radio" name="gender" id="other" value="Other" />
          <label for="other"><b>Other</b></label>
        </fieldset>

        <br />
        <label for="department"><b>Department:</b></label>
        <select name="department" id="department">
          <option value="CSE">CSE</option>
          <option value="EEE">EEE</option>
          <option value="BBA">BBA</option>
          <option value="English">English</option>
        </select>
        <br /><br />
        <fieldset>
          <legend><b>Skills:</b></legend>
          <input type="checkbox" name="skills" id="html" value="HTML" />
          <label for="html"><b>HTML</b></label>
          <input type="checkbox" name="skills" id="css" value="CSS" />
          <label for="css"><b>CSS</b></label>
          <input
            type="checkbox"
            name="skills"
            id="javascript"
            value="JavaScript"
          />
          <label for="javascript"><b>JavaScript</b></label>
          <input type="checkbox" name="skills" id="react" value="React" />
          <label for="react"><b>React</b></label>
        </fieldset>

        <br />
        <label for="address"><b>Address:</b></label
        ><br />
        <textarea
          name="address"
          id="address"
          placeholder="Enter your address"
          required
        ></textarea>
        <br /><br />
        <label for="profile-pic"><b>Profile Picture:</b></label>
        <br />
        <input type="file" name="profile-pic" id="profile-pic" />
        <br /><br />
        <label for="password"><b>Password:</b></label>
        <input
          type="password"
          name="password"
          id="password"
          placeholder="Enter your password"
          required
        />
        <br /><br />
        <label for="confirm-password"><b>Confirm Password:</b></label>
        <input
          type="password"
          name="confirm-password"
          id="confirm-password"
          placeholder="Enter your password again"
          required
        />
        <br /><br />
        <button type="submit">Submit</button>
      </fieldset>
    </form>
  </body>
</html>
